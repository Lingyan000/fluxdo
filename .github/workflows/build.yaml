name: Build and Release

# fork 专用精简版:上游那套 Android(签名/GCP/Crashlytics)、Flatpak、
# changelog、Telegram/AltStore/GitHub Pages 全靠 fork 上没有的 secrets,
# 只会失败并发邮件。这里只保留在 fork 上能稳定绿的 iOS / macOS / Windows,
# 构建完直接把产物发到本 fork 的 Release。

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
            arch: arm64
            excluded-arch: x86_64
          - platform: macos
            os: macos-latest
            arch: x86_64
            excluded-arch: arm64
          - platform: windows
            os: windows-2022
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ${{ matrix.platform }}-${{ matrix.arch || matrix.flutter-target }}

      - name: Setup iOS Rust targets
        if: matrix.platform == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Configure Git for CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          dart tool/flutterw.dart build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r fluxdo-unsigned.ipa Payload
          mv fluxdo-unsigned.ipa ../../../dist/

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: npm install -g appdmg

      # 自签代码签名:与本地开发共用同一张证书,保证升级版本后钥匙串
      # (flutter_secure_storage)ACL 按证书持续授信,不重复弹窗。
      # secrets 缺失时(如 fork)整步跳过,回退 AppInfo.xcconfig 默认 adhoc 签名。
      - name: Setup macOS code signing
        if: matrix.platform == 'macos'
        env:
          P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "MACOS_CODESIGN_P12_BASE64 未配置,回退 adhoc 签名"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # 允许 codesign 免交互使用私钥(CI 无 GUI,不设置会卡死在授权弹窗)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # 自签证书需要显式授信 codeSign 策略,identity 才会被视为有效
          openssl pkcs12 -in "$RUNNER_TEMP/codesign.p12" -passin "pass:$P12_PASSWORD" \
            -nokeys -legacy -clcerts | openssl x509 -out "$RUNNER_TEMP/codesign.cer" -outform DER
          sudo security add-trusted-cert -d -p codeSign -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/codesign.cer"
          rm -f "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "FluxDO Code Signing"
          # 通过 Local.xcconfig 覆盖签名身份(与本地开发同一机制)
          printf '%s\n' \
            'FLUXDO_APPLE_CODE_SIGN_IDENTITY_MACOSX = FluxDO Code Signing' \
            'FLUXDO_APPLE_CODE_SIGN_STYLE = Manual' \
            'FLUXDO_APPLE_CODE_SIGNING_ALLOWED = YES' > apple/Local.xcconfig

      - name: Build macOS
        if: matrix.platform == 'macos'
        env:
          FLUXDO_MACOS_ARCH: ${{ matrix.arch }}
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded-arch }}
          HAS_CODESIGN_CERT: ${{ secrets.MACOS_CODESIGN_P12_BASE64 != '' }}
        run: |
          dart tool/flutterw.dart build macos --release
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/fluxdo.app"
          test -f "$APP_PATH/Contents/Frameworks/libdoh_proxy.dylib"
          test -f "$APP_PATH/Contents/Resources/native/doh_proxy_bin"
          test -x "$APP_PATH/Contents/Resources/native/doh_proxy_bin"
          lipo -archs "$APP_PATH/Contents/MacOS/fluxdo" | grep -qw "${{ matrix.arch }}"
          lipo -archs "$APP_PATH/Contents/Frameworks/libdoh_proxy.dylib" | grep -qw "${{ matrix.arch }}"
          # 有证书时校验产物确实用自签证书签名(而非静默回退 adhoc)
          if [ "$HAS_CODESIGN_CERT" = "true" ]; then
            codesign -dvv "$APP_PATH" 2>&1 | grep "Authority=FluxDO Code Signing"
            if codesign -dv "$APP_PATH" 2>&1 | grep -q "flags=0x2(adhoc)"; then
              echo "error: 产物仍是 adhoc 签名" >&2
              exit 1
            fi
          fi

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          cat > dmg-config.json << 'DMGEOF'
          {
            "title": "Fluxdo",
            "contents": [
              { "x": 448, "y": 344, "type": "link", "path": "/Applications" },
              { "x": 192, "y": 344, "type": "file", "path": "build/macos/Build/Products/Release/fluxdo.app" }
            ],
            "window": {
              "size": { "width": 660, "height": 500 }
            }
          }
          DMGEOF
          appdmg dmg-config.json "dist/fluxdo-macos-${{ matrix.arch }}.dmg"

      - name: Setup NuGet
        if: matrix.platform == 'windows'
        uses: nuget/setup-nuget@v2

      - name: Setup NASM
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          dart tool/flutterw.dart build windows --release
          $releaseDir = "build\\windows\\x64\\runner\\Release"
          if (-not (Test-Path "$releaseDir\\native\\doh_proxy.dll")) { throw "Missing doh_proxy.dll" }
          if (-not (Test-Path "$releaseDir\\native\\doh_proxy_bin.exe")) { throw "Missing doh_proxy_bin.exe" }
          mkdir dist

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip "..\..\..\..\..\dist\fluxdo-windows-x86_64.zip" .

      - name: Build Windows Installer (exe)
        if: matrix.platform == 'windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version windows\setup.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist/

      - name: Generate SHA256 checksums
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
          draft: false
          # tag 里带 '-'(如 markreveal.6)一律当 prerelease
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
