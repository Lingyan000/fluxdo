name: Plugin mobile runtime
on:
  workflow_dispatch:
  push:
    branches: [dev, main, codex/ld-store-native-checkout]
    paths:
      - '.github/workflows/plugin-mobile-smoke.yaml'
      - 'tool/plugin_tools/create_mobile_smoke.dart'
      - 'tool/plugin_tools/mobile_smoke_test.txt'
      - 'packages/qjs/**'
      - 'packages/fluxdo_plugin_runtime/**'
      - 'lib/modules/metaverse/plugin/runtime/**'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: dart tool/plugin_tools/create_mobile_smoke.dart
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: build/plugin-mobile-smoke
          script: flutter test integration_test/runtime_test.dart -d emulator-5554
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: dart tool/plugin_tools/create_mobile_smoke.dart
      - name: Run iOS simulator smoke
        run: |
          device=$(xcrun simctl list devices available -j | ruby -rjson -e 'd=JSON.parse(STDIN.read)["devices"].values.flatten.find{|d|d["name"].start_with?("iPhone")};abort "No simulator" unless d;puts d["udid"]')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          cd build/plugin-mobile-smoke
          flutter test integration_test/runtime_test.dart -d "$device"
