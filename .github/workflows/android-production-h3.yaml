name: Android production H3 through emulator UDP relay
on:
  push:
    branches: ['diagnostics/android-production-h3-*']
  workflow_dispatch:
    inputs:
      force_control:
        description: '仅临时模拟器：限定探针 origin 与 SPKI 的 QUIC 对照'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-production-h3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      FLUXDO_NATIVE_PROBE_NETLOG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Verify dual loopback UDP relay
        run: |
          mkdir -p "${{ runner.temp }}/udp-test"
          javac -d "${{ runner.temp }}/udp-test" tool/native_fingerprint/android/app/src/main/java/com/fluxdo/fingerprintprobe/UdpBridge.java tool/native_fingerprint/android/UdpBridgeSmoke.java
          java -cp "${{ runner.temp }}/udp-test" com.fluxdo.fingerprintprobe.UdpBridgeSmoke | tee "${{ runner.temp }}/udp-test/result.json"
      - name: Build native WebView host
        run: gradle -p tool/native_fingerprint/android :app:assembleDebug
      - name: Build Core diagnostic collector
        run: cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe --example h3_fingerprint_probe --example h3_production_client
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install tool/native_fingerprint/android/app/build/outputs/apk/debug/app-debug.apk
            chmod +x tool/native_fingerprint/android_driver.py
            python tool/native_fingerprint/run.py --platform android --production-h3 --qpack-scenarios ${{ (inputs.force_control || contains(github.ref_name, '-force-')) && '--force-quic-control' || '' }} --output "${{ runner.temp }}/native-fingerprint"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-production-h3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/udp-test/result.json
            ${{ runner.temp }}/native-fingerprint/**/*.json
            ${{ runner.temp }}/native-fingerprint/**/*.log
            ${{ runner.temp }}/native-fingerprint/**/*.stdout
            ${{ runner.temp }}/native-fingerprint/**/*.stderr
