app-id: com.github.lingyan000.fluxdo
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
  - org.freedesktop.Sdk.Extension.rust-stable
command: fluxdo
separate-locales: false
build-options:
  append-path: /usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
# 视频播放(media_kit → dlopen libmpv.so.2)的编解码依赖:runtime 自带的
# ffmpeg 只含自由编解码器,ffmpeg-full 扩展在 /app/lib/ffmpeg 提供全量
# (H.264/HEVC 等),add-ld-path 让其优先于 runtime 同名库。未安装扩展时
# 回落 runtime ffmpeg,仅编解码器覆盖面变窄,不影响启动。
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '24.08'
    directory: lib/ffmpeg
    add-ld-path: .
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=system-bus
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-documents:rw
modules:
  - name: wpe-layer
    buildsystem: simple
    build-commands:
      - |
        set -eu
        for dir in bin include lib libexec share; do
          if [ -e "${dir}" ]; then
            cp -a "${dir}" /app/
          fi
        done
    sources:
      - type: archive
        path: stage/wpe-layer/fluxdo-flatpak-wpe-layer-gnome48-x86_64.tar.zst

  # === libmpv 链(视频播放,media_kit 运行期 dlopen libmpv.so.2)===
  # GNOME runtime 不带 libmpv,自建最小集:libass + libplacebo 是 mpv
  # 硬依赖,ffmpeg 用 runtime 自带的(全量编解码由 ffmpeg-full 扩展在
  # 运行期补,见顶部 add-extensions)。版本组合取自 Celluloid flathub
  # 清单(mpv 0.41 + libplacebo 7.360.1 + libass 0.17.5,已验证兼容)。
  - name: libass
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  - name: libplacebo
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Dmanpage-build=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: fluxdo
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/fluxdo /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - bash source-tree/scripts/ci/flatpak/build_app.sh "$(pwd)/source-tree" /app/fluxdo
      - install -Dm755 source-tree/flatpak/fluxdo-wrapper.sh /app/bin/fluxdo
      - install -Dm644 source-tree/flatpak/com.github.lingyan000.fluxdo.desktop /app/share/applications/com.github.lingyan000.fluxdo.desktop
      - install -Dm644 source-tree/flatpak/com.github.lingyan000.fluxdo.metainfo.xml /app/share/metainfo/com.github.lingyan000.fluxdo.metainfo.xml
      - install -Dm644 source-tree/flatpak/icons/com.github.lingyan000.fluxdo.png /app/share/icons/hicolor/512x512/apps/com.github.lingyan000.fluxdo.png
      # 媒体压缩:静态 ffmpeg 进 /app/bin(PATH),app 运行时按 PATH 查找。
      # 沙箱构建阶段禁网,CMake 的构建期下载会跳过(WARNING),CLI 由
      # 本 source 在源准备阶段(允许联网+sha256 校验)提供。
      - install -Dm755 ffmpeg-linux-x64 /app/bin/ffmpeg
      - rm -rf /app/include /app/lib/pkgconfig /app/share/pkgconfig /app/share/aclocal
      - rm -f /app/bin/unifdef /app/bin/woff2_compress /app/bin/woff2_decompress
    sources:
      - type: dir
        path: stage/source-tree
        dest: source-tree
      - type: file
        url: https://npmmirror.com/mirrors/ffmpeg-static/b6.0/ffmpeg-linux-x64
        sha256: ed652b2f32e0851d1946894fb8333f5b677c1b2ce6b9d187910a67f8b99da028
        dest-filename: ffmpeg-linux-x64
