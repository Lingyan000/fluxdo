name: Full Android release verification
on:
  push:
    branches: ['diagnostics/tailscale-h3-preflight-20261116']
    paths: ['.github/workflows/android-full-app-check.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluxdo-full-android-verification
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Lingyan000/fluxdo' && github.ref == 'refs/heads/diagnostics/tailscale-h3-preflight-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Release unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          key: full-android-x64-release
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724'
      - name: Prepare native toolchain
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Build full release app with ephemeral debug signing
        run: |
          flutter pub get
          dart tool/flutterw.dart build apk --release --target-platform android-x64 --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-x86_64-validation.apk
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          apk = pathlib.Path('dist/fluxdo-x86_64-validation.apk')
          with zipfile.ZipFile(apk) as archive:
              assert 'lib/x86_64/libfluxdo_net.so' in archive.namelist()
          pathlib.Path('dist/build-evidence.json').write_text(json.dumps({
              'head': os.environ['GITHUB_SHA'], 'full_flutter_app': True, 'release': True,
              'architecture': 'x86_64', 'signing': 'ephemeral debug key; not a release distribution',
              'core_library_packaged': True, 'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-android-release-${{ github.run_id }}
          path: dist/
          retention-days: 7
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tool/native_fingerprint/android_app_smoke.py --apk dist/fluxdo-x86_64-validation.apk --output "$RUNNER_TEMP/android-full-app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-android-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/android-full-app/
          retention-days: 7
