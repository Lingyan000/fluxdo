name: Apple WKWebView fingerprint probe

on:
  push:
    branches: ['diagnostics/apple-fingerprint-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-fingerprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-probe:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          key: apple-fingerprint-macos-15
          cache-on-failure: true
      - name: Prepare diagnostic build tools
        run: |
          command -v cmake || brew install cmake
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          chmod +x tool/apple_fingerprint/ios_driver.py
      - name: Build production core diagnostic
        run: cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe
      - name: Run macOS and iOS native WKWebView scenarios
        run: python3 tool/apple_fingerprint/run.py --output "$RUNNER_TEMP/apple-fingerprint" --simulator-limit 2
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-wkwebview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apple-fingerprint/**/*.json
            ${{ runner.temp }}/apple-fingerprint/**/*.log
            ${{ runner.temp }}/apple-fingerprint/**/*.stdout
            ${{ runner.temp }}/apple-fingerprint/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
