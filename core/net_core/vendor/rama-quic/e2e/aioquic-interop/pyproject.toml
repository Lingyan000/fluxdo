# The peer's environment. uv.lock pins the dependency graph; .python-version pins which
# interpreter uv selects. The environment is built into .venv inside this directory and the
# tests use that interpreter, never the machine's own. uv's download cache and its managed
# interpreters live outside this directory.
[project]
name = "rama-aioquic-peer"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioquic==1.7.1",
]

[tool.uv]
package = false
