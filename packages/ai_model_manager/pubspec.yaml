name: ai_model_manager
description: AI 模型服务配置管理
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  material_ui: ^1.11.1
  flutter:
    sdk: flutter
  common_ui:
    path: ../common_ui
  m3e_ui:
    path: ../m3e_ui
  flutter_riverpod:
  dio:
  http: ^1.6.0
  flutter_secure_storage:
  shared_preferences:
  path_provider:
  path:
  uuid:
  app_icons:
    path: ../app_icons
  # 直接用各 LLM provider 的官方 SDK，不经过 langchain_dart 抽象层
  openai_dart: ^12.0.0           # 同时覆盖 Chat Completions + Responses API
  googleai_dart: ^13.1.0         # Gemini
  anthropic_sdk_dart: ^11.0.0    # Anthropic + Extended Thinking

dev_dependencies:
  flutter_test:
    sdk: flutter
