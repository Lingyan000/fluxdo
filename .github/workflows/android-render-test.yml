# 临时渲染后端对照测试工作流。
# 固定使用 Flutter 3.44.0，与 v0.2.27 Android CI 的构建环境一致。
# 测试完成后删除本文件，不纳入正式发布流程。
name: Android Render Test (temporary)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要测试的分支、提交或标签；留空使用当前 ref'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'render-test-*'

concurrency:
  group: android-render-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  TEST_APPLICATION_ID: 'com.github.lingyan000.fluxdo.ci3440'
  TEST_APPLICATION_SUFFIX: '.ci3440'

jobs:
  build-android-arm64:
    name: Build Android arm64 (Flutter 3.44.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          echo "清理前:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "清理后:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: android-arm64-render-test

      - name: Setup Android dependencies
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Create temporary Firebase configuration
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fluxdo-render-test",
              "storage_bucket": "fluxdo-render-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.github.lingyan000.fluxdo.ci3440"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForRenderTestOnly000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Inject temporary application ID suffix support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          marker = '        applicationId = "com.github.lingyan000.fluxdo"\n'
          addition = '        applicationIdSuffix = project.findProperty("appIdSuffix")?.toString()\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('未找到 Android applicationId 配置')
              text = text.replace(marker, marker + addition, 1)
              path.write_text(text)
          PY

      - name: Build Android render test APK
        env:
          ORG_GRADLE_PROJECT_appIdSuffix: ${{ env.TEST_APPLICATION_SUFFIX }}
        run: |
          dart tool/flutterw.dart build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=cronetHttpNoPlay=true \
            --split-debug-info=build/symbols
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/fluxdo-render-test-flutter-${FLUTTER_VERSION}-arm64.apk"

      - name: Upload Android render test APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-render-test-flutter-3440-arm64
          path: dist/fluxdo-render-test-flutter-3.44.0-arm64.apk
          if-no-files-found: error
          retention-days: 3
