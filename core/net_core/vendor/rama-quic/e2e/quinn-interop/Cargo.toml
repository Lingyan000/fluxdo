# Standalone: not a member of the rama workspace, with its own lockfile, so the upstream QUIC
# peer never reaches the workspace resolution.
[workspace]

[package]
name = "rama-quic-quinn-interop"
version = "0.0.0"
edition = "2024"
publish = false

[features]
boring = ["rama/boring", "interop-common/boring"]
rustls-ring = ["rama/rustls", "rama/ring", "interop-common/rustls-ring"]
rustls-aws-lc = ["rama/rustls", "rama/aws-lc", "interop-common/rustls-aws-lc"]

[dependencies]

[dev-dependencies]
rama = { path = "../../..", default-features = false, features = ["std", "quic", "http-backend", "dns", "tcp"] }
interop-common = { package = "rama-quic-interop-common", path = "../interop-common", default-features = false, features = ["peer-rustls"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.13"
sha2 = "0.11"
serde_json = "1"
