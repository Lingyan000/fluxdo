import javax.inject.Inject
import org.gradle.process.ExecOperations
import org.gradle.util.GradleVersion

abstract class FluxdoCargoKitExec {
    @Inject
    abstract ExecOperations getExecOperations()
}

// Cargokit 当前稳定版仍调用 Gradle 9 已移除的 Project.exec。
// 仅为实际应用了 CargoKitPlugin 的子项目转接到官方 ExecOperations，
// 保留原命令、环境变量和非零退出失败语义，不修改共享的 pub 缓存。
if (GradleVersion.current() >= GradleVersion.version('9.0')) {
    subprojects { child ->
        child.plugins.all { plugin ->
            if (plugin.class.name == 'CargoKitPlugin') {
                def executor = child.objects.newInstance(FluxdoCargoKitExec)
                child.ext.exec = { Closure configure ->
                    executor.execOperations.exec { spec ->
                        child.configure(spec, configure)
                    }
                }
            }
        }
    }
}
