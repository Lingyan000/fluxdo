name: iOS 15 WKWebView fingerprint probe

on:
  push:
    branches: ['diagnostics/ios15-fingerprint-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-probe:
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        ios: ['15.0', '15.5']
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install and boot official iOS runtime
        run: python3 tool/apple_fingerprint/install_legacy_runtime.py --version '${{ matrix.ios }}' --output "$RUNNER_TEMP/ios15-capability"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          key: apple-fingerprint-macos-15
      - name: Build production core diagnostic
        run: |
          command -v cmake || brew install cmake
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          chmod +x tool/apple_fingerprint/ios_driver.py
          cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe
      - name: Run native WKWebView scenarios
        run: python3 tool/apple_fingerprint/run.py --output "$RUNNER_TEMP/ios15-fingerprint" --ios-version '${{ matrix.ios }}'
      - name: Upload capability and fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.ios }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios15-capability/*.json
            ${{ runner.temp }}/ios15-capability/*.log
            ${{ runner.temp }}/ios15-fingerprint/**/*.json
            ${{ runner.temp }}/ios15-fingerprint/**/*.log
            ${{ runner.temp }}/ios15-fingerprint/**/*.stdout
            ${{ runner.temp }}/ios15-fingerprint/**/*.stderr
          retention-days: 14
