name: Tailscale trusted origin diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '按需运行；构建完成后才加入临时节点'
        type: choice
        options: [preflight, android-h3, android-production-h3, windows-production-h3, macos-production-h3, apple-production-h3, ios15-production-h3, ios-core-production-h3, browserstack-account, public-endpoint]
        default: preflight
      app_only:
        description: '已有原生 UA 证据时，仅补应用 UA 与证书负对照'
        type: boolean
        default: false
      ios_core:
        description: 'Apple 模式追加模拟器 App 内生产 Core 验证'
        type: boolean
        default: false
      physical_ios:
        description: '模拟器公开协议检查通过后，最多创建一次 120 秒 iOS 真机会话'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tailscale-h3-${{ (inputs.mode == 'browserstack-account' || inputs.mode == 'public-endpoint') && 'account' || 'network' }}
  cancel-in-progress: false
jobs:
  public-endpoint:
    if: inputs.mode == 'public-endpoint' && github.repository == 'Lingyan000/fluxdo'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read public protocol advertisements without devices
        run: python3 tool/native_fingerprint/check_public_trace.py "$RUNNER_TEMP/public-endpoint.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-endpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/public-endpoint.json
          retention-days: 7
  preflight:
    if: inputs.mode == 'preflight' && github.repository == 'Lingyan000/fluxdo' && github.ref == 'refs/heads/diagnostics/tailscale-h3-preflight-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read public federation identifiers
        id: config
        run: |
          python3 tool/native_fingerprint/tailscale_preflight.py --config
          install -d -m 700 "$RUNNER_TEMP/fluxdo-tailscale-state"
      - name: Join one ephemeral node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ steps.config.outputs.client_id }}
          audience: ${{ steps.config.outputs.audience }}
          tags: tag:fluxdo-ci
          hostname: fluxdo-h3-preflight
          version: '1.104.5'
          statedir: ${{ runner.temp }}/fluxdo-tailscale-state
          retry: '1' # 官方参数表示总尝试次数；1 即只连接一次。
          timeout: 60s
      - name: Check certificate and local tailnet address sockets
        run: python3 tool/native_fingerprint/tailscale_preflight.py --output "$RUNNER_TEMP/tailscale-evidence/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailscale-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/tailscale-evidence/result.json
          retention-days: 7
  android-h3:
    if: (inputs.mode == 'android-h3' || inputs.mode == 'android-production-h3') && github.repository == 'Lingyan000/fluxdo' && github.ref == 'refs/heads/diagnostics/tailscale-h3-preflight-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Validate and build before joining tailnet
        run: |
          PYTHONPATH=tool/native_fingerprint python3 -m unittest test_android_quic_control test_tailscale_preflight test_tailscale_h3 test_android_adb
          gradle -p tool/native_fingerprint/android :app:assembleDebug
          cargo test --locked --manifest-path core/net_core/Cargo.toml --example h3_fingerprint_probe --example h3_production_client
          cargo build --locked --manifest-path core/net_core/Cargo.toml --example h3_fingerprint_probe --example h3_production_client --example fingerprint_probe
          chmod +x tool/native_fingerprint/android_driver.py
      - name: Prepare emulator before joining tailnet
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'platform-tools' 'emulator' > /dev/null
      - name: Read public federation identifiers
        id: config
        run: |
          python3 tool/native_fingerprint/tailscale_preflight.py --config
          install -d -m 700 "$RUNNER_TEMP/fluxdo-tailscale-state"
      - name: Join one ephemeral node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ steps.config.outputs.client_id }}
          audience: ${{ steps.config.outputs.audience }}
          tags: tag:fluxdo-ci
          hostname: fluxdo-h3-preflight
          version: '1.104.5'
          statedir: ${{ runner.temp }}/fluxdo-tailscale-state
          retry: '1'
          timeout: 60s
      - name: Verify trusted Alt-Svc and untrusted-certificate rejection
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 100.100.100.100
          script: |
            adb install tool/native_fingerprint/android/app/build/outputs/apk/debug/app-debug.apk
            timeout 360s python3 tool/native_fingerprint/tailscale_h3.py ${{ inputs.mode == 'android-production-h3' && '--production' || '' }} ${{ inputs.app_only && '--app-only' || '' }} --output "${{ runner.temp }}/trusted-h3"
      - name: Leave tailnet immediately after test
        if: always()
        run: sudo tailscale logout || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailscale-android-h3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trusted-h3/**/*.json
            ${{ runner.temp }}/trusted-h3/**/*.log
            ${{ runner.temp }}/trusted-h3/**/*.stdout
            ${{ runner.temp }}/trusted-h3/**/*.stderr
          retention-days: 7
  windows-h3:
    if: inputs.mode == 'windows-production-h3' && github.repository == 'Lingyan000/fluxdo' && github.ref == 'refs/heads/diagnostics/tailscale-h3-preflight-20261116'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          cache-on-failure: true
      - uses: ilammy/setup-nasm@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Build Core and shared-main-environment Flutter host
        run: |
          cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe --example h3_fingerprint_probe --example h3_production_client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/native_fingerprint/windows_flutter/prepare.py "$env:RUNNER_TEMP/h3-flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:RUNNER_TEMP/h3-flutter"
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Read public federation identifiers
        id: config
        run: python tool/native_fingerprint/tailscale_preflight.py --config
      - name: Join one ephemeral Windows node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ steps.config.outputs.client_id }}
          audience: ${{ steps.config.outputs.audience }}
          tags: tag:fluxdo-ci
          hostname: fluxdo-h3-windows
          version: '1.104.5'
          retry: '1'
          timeout: 60s
      - name: Verify normal trust in shared main WebView environment
        timeout-minutes: 6
        run: python tool/native_fingerprint/tailscale_h3.py --platform windows --driver "$env:RUNNER_TEMP/h3-flutter/build/windows/x64/runner/Release/h3_probe_host.exe" --production --output "$env:RUNNER_TEMP/trusted-h3"
      - name: Leave tailnet before uploading evidence
        if: always()
        run: |
          if (Get-Command tailscale -ErrorAction SilentlyContinue) { tailscale logout }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailscale-windows-h3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trusted-h3/**/*.json
            ${{ runner.temp }}/trusted-h3/**/*.log
            ${{ runner.temp }}/trusted-h3/**/*.stdout
            ${{ runner.temp }}/trusted-h3/**/*.stderr
            ${{ runner.temp }}/h3-flutter/production-source.json
          retention-days: 7
  browserstack-account:
    if: inputs.mode == 'browserstack-account' && github.repository == 'Lingyan000/fluxdo'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read App Automate account and device availability without sessions
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        shell: python
        run: |
          import base64, http.client, json, os
          values = [os.environ.get(name) for name in ('BROWSERSTACK_USERNAME', 'BROWSERSTACK_ACCESS_KEY')]
          if not all(values):
              raise SystemExit('Missing configured BrowserStack credentials; no device started')
          auth = 'Basic ' + base64.b64encode(':'.join(values).encode()).decode()
          def read(path):
              connection = http.client.HTTPSConnection('api-cloud.browserstack.com', timeout=20)
              try:
                  connection.request('GET', path, headers={'Authorization': auth})
                  response = connection.getresponse()
                  if response.status != 200:
                      raise RuntimeError(f'Read-only account check: HTTP {response.status}')
                  return json.loads(response.read())
              finally:
                  connection.close()
          plan = read('/app-automate/plan.json')
          fields = ('automate_plan', 'parallel_sessions_running', 'parallel_sessions_max_allowed', 'queued_sessions')
          devices = read('/app-automate/devices.json')
          report = {'plan': {name: plan.get(name) for name in fields}, 'device_sessions_created': 0,
              'available_os_versions': sorted({str(d.get('os')) + ' ' + str(d.get('os_version')) for d in devices}),
              'remaining_free_minutes_verified': False}
          print(json.dumps(report, indent=2))
  apple-h3:
    if: (inputs.mode == 'macos-production-h3' || inputs.mode == 'apple-production-h3' || inputs.mode == 'ios15-production-h3' || inputs.mode == 'ios-core-production-h3') && github.repository == 'Lingyan000/fluxdo' && github.ref == 'refs/heads/diagnostics/tailscale-h3-preflight-20261116'
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install iOS 15 runtime before joining tailnet
        if: inputs.mode == 'ios15-production-h3'
        run: python3 tool/apple_fingerprint/install_legacy_runtime.py --version 15.5 --output "$RUNNER_TEMP/ios15-capability"
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          key: apple-fingerprint-macos-15
          cache-on-failure: true
      - name: Build and warm native hosts before joining tailnet
        run: |
          command -v cmake || brew install cmake
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          chmod +x tool/apple_fingerprint/ios_driver.py
          cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe --example h3_fingerprint_probe --example h3_production_client
          python3 tool/apple_fingerprint/prepare_trusted.py --output "$RUNNER_TEMP/trusted-apple-prepared" ${{ inputs.mode == 'macos-production-h3' && '--mac-only' || inputs.mode == 'ios15-production-h3' && '--ios-version 15.5 --ios-only' || '--ios-version 26.2' }} ${{ (inputs.mode == 'ios-core-production-h3' || inputs.ios_core || inputs.physical_ios) && '--ios-only --ios-core' || '' }}
      - name: Prepare optional physical-device package before joining tailnet
        if: inputs.physical_ios
        run: |
          PYTHONPATH=tool/apple_fingerprint python3 -m unittest test_public_trace
          python3 tool/apple_fingerprint/prepare_device.py --prepared "$RUNNER_TEMP/trusted-apple-prepared"
      - name: Read public federation identifiers
        id: config
        run: |
          python3 tool/native_fingerprint/tailscale_preflight.py --config
          install -d -m 700 "$RUNNER_TEMP/fluxdo-tailscale-state"
      - name: Save runner DNS before Tailscale changes it
        run: python3 tool/apple_fingerprint/tailnet_dns.py --state "$RUNNER_TEMP/apple-dns-before.json"
      - name: Join one ephemeral Apple node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ steps.config.outputs.client_id }}
          audience: ${{ steps.config.outputs.audience }}
          tags: tag:fluxdo-ci
          hostname: fluxdo-h3-apple
          version: '1.104.5'
          statedir: ${{ runner.temp }}/fluxdo-tailscale-state
          retry: '1'
          timeout: 60s
      - name: Preserve public DNS and scope MagicDNS to this tailnet
        timeout-minutes: 2
        run: python3 tool/apple_fingerprint/tailnet_dns.py --state "$RUNNER_TEMP/apple-dns-before.json" --split
      - name: Verify default system trust and production replay
        timeout-minutes: 13
        run: python3 tool/apple_fingerprint/run_trusted.py --prepared "$RUNNER_TEMP/trusted-apple-prepared" --output "$RUNNER_TEMP/trusted-apple"
      - name: Verify production C ABI inside the iOS simulator app
        if: inputs.mode == 'ios-core-production-h3' || inputs.ios_core || inputs.physical_ios
        timeout-minutes: 4
        run: python3 tool/apple_fingerprint/run_ios_core.py --prepared "$RUNNER_TEMP/trusted-apple-prepared" --output "$RUNNER_TEMP/trusted-apple"
      - name: Leave tailnet before uploading evidence
        if: always()
        run: |
          if command -v tailscale >/dev/null; then sudo tailscale logout; fi
      - name: Restore runner DNS for public protocol checks
        if: always()
        run: python3 tool/apple_fingerprint/tailnet_dns.py --state "$RUNNER_TEMP/apple-dns-before.json" --restore
      - name: Verify public protocol on simulator before using a device
        if: inputs.physical_ios && success()
        timeout-minutes: 4
        run: python3 tool/apple_fingerprint/verify_public_trace.py --prepared "$RUNNER_TEMP/trusted-apple-prepared" --output "$RUNNER_TEMP/trusted-apple/public-trace-simulator"
      - name: Run at most one bounded iOS physical-device session
        if: inputs.physical_ios && success()
        timeout-minutes: 5
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python3 tool/apple_fingerprint/browserstack_core.py --ipa "$RUNNER_TEMP/trusted-apple-prepared/ios-core-trace.ipa" --simulator-result "$RUNNER_TEMP/trusted-apple/public-trace-simulator/result.json" --output "$RUNNER_TEMP/trusted-apple/physical-ios" --ios-major ${{ inputs.mode == 'ios15-production-h3' && '15' || '26' }}
      - name: Remove only simulators created by this job
        if: always()
        run: python3 tool/apple_fingerprint/prepare_trusted.py --output "$RUNNER_TEMP/trusted-apple-prepared" --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailscale-apple-h3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trusted-apple/**/*.json
            ${{ runner.temp }}/trusted-apple/**/*.log
            ${{ runner.temp }}/trusted-apple/**/*.stdout
            ${{ runner.temp }}/trusted-apple/**/*.stderr
            ${{ runner.temp }}/trusted-apple-prepared/*.json
            ${{ runner.temp }}/trusted-apple-prepared/*.log
            ${{ runner.temp }}/trusted-apple-prepared/*.stdout
            ${{ runner.temp }}/trusted-apple-prepared/*.stderr
            ${{ runner.temp }}/trusted-apple-prepared/*.png
            ${{ runner.temp }}/ios15-capability/*.json
          retention-days: 7
