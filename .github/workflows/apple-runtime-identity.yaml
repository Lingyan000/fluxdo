name: Apple runtime browser identity
on:
  push:
    branches: ['diagnostics/apple-identity-*']
  workflow_dispatch:
    inputs:
      sdk_only:
        description: '只编译检查诊断宿主，不启动模拟器或真机'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  identity:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Typecheck physical and simulator hosts with public SDKs
        run: |
          for sdk in iphoneos iphonesimulator; do
            target=arm64-apple-ios15.0
            if [ "$sdk" = iphonesimulator ]; then target=arm64-apple-ios15.0-simulator; fi
            xcrun --sdk "$sdk" swiftc -typecheck -swift-version 5 -parse-as-library -D FLUXDO_CORE_DIAGNOSTIC \
              -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" -target "$target" \
              tool/apple_fingerprint/WKProbe.swift ios/Runner/BrowserIdentity.swift tool/apple_fingerprint/IOSCoreProbe.swift
          done
      - name: Inspect public browser bundle metadata
        if: '!inputs.sdk_only'
        run: python3 tool/apple_fingerprint/runtime_identity.py --output "$RUNNER_TEMP/apple-identity.json" --ios-version 26.0.1
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.sdk_only
        with:
          name: apple-runtime-identity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apple-identity.json
            ${{ runner.temp }}/safari-user-agent.json
          retention-days: 14
