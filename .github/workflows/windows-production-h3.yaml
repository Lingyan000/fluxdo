name: Windows native H3 and certificate controls
on:
  push:
    branches: ['diagnostics/windows-production-h3-*']
  workflow_dispatch:
    inputs:
      mode:
        description: '默认原生采样；证书许可仅用于一次性 runner 对照'
        type: choice
        default: native
        options: [native, spki-control, root-trust-only]
permissions:
  contents: read
concurrency:
  group: windows-production-h3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          cache-on-failure: true
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native WebView2 host
        run: dotnet build tool/native_fingerprint/windows/Probe.csproj -c Release
      - name: Build Core diagnostic collector
        run: cargo build --locked --manifest-path core/net_core/Cargo.toml --example fingerprint_probe --example h3_fingerprint_probe --example h3_production_client
      - name: Compare native WebView2 and Windows Core
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_REF: ${{ github.ref_name }}
        run: |
          $mode = $env:DIAGNOSTIC_MODE
          if (-not $mode) {
            if ($env:DIAGNOSTIC_REF -like '*-root-trust-*') { $mode = 'root-trust-only' }
            elseif ($env:DIAGNOSTIC_REF -like '*-spki-*') { $mode = 'spki-control' }
            else { $mode = 'native' }
          }
          $arguments = @('--platform', 'windows', '--production-h3', '--output', "$env:RUNNER_TEMP/native-fingerprint")
          if ($mode -ne 'native') { $arguments += "--$mode" }
          python tool/native_fingerprint/run.py @arguments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-production-h3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-fingerprint/**/*.json
            ${{ runner.temp }}/native-fingerprint/**/*.log
            ${{ runner.temp }}/native-fingerprint/**/*.stdout
            ${{ runner.temp }}/native-fingerprint/**/*.stderr
