name: BrowserStack single Android smoke test

on:
  push:
    branches: ['diagnostics/browserstack-smoke-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserstack-single-device
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run one bounded Android launch check
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python3 tool/browserstack_smoke.py
      - name: Save screenshot and session duration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-smoke-${{ github.run_id }}
          path: browserstack-smoke-output/
          retention-days: 7
