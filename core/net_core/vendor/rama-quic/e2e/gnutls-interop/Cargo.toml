[workspace]

[package]
name = "rama-quic-gnutls-interop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
parking_lot = "0.13"
rama = { path = "../../..", default-features = false, features = ["quic"] }
zeroize = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.11"

# The FFI bridge follows the rama workspace's unsafe hygiene.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
default_union_representation = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
as_ptr_cast_mut = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
